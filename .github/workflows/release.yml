name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release 的 tag（例如 v1.9.0），版本号以此为准，会自动写回 manifest.json'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          # tag 即版本号唯一来源：push tag 时取 ref_name，手动触发时取输入
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "tag 为空，无法确定版本号" >&2
            exit 1
          fi
          VERSION=$(echo "$TAG" | sed 's/^v//')
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ($TAG) 格式不对，应为 vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # 写回 manifest，仓库里不用手改 version 了
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
          if [ -f manifest.firefox.json ]; then
            jq --arg v "$VERSION" '.version = $v' manifest.firefox.json > manifest.firefox.json.tmp && mv manifest.firefox.json.tmp manifest.firefox.json
          fi
          echo "manifest version 已更新为 $VERSION"

      - name: Create zip package
        run: |
          zip -r GeoFill-v${{ steps.version.outputs.version }}.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.md" \
            -x ".gitignore"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoFill-v${{ steps.version.outputs.version }}
          path: GeoFill-v${{ steps.version.outputs.version }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: GeoFill-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
        env:
GITHUB_TOKEN: <redacted>
